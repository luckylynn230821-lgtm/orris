name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Isolated tests refuse to run when this is set. CI must not receive Neon.
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: playwright local
        run: |
          npm run dev > /tmp/orris-dev.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "dev server did not answer" >&2
            tail -n 80 /tmp/orris-dev.log >&2
            exit 1
          fi
          npx playwright test --project=local

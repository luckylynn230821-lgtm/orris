<title>ORRIS — Objects for a considered life</title>
<meta name="description" content="Objects for a considered life. A portable copy of the ORRIS shop." />
<meta name="theme-color" content="#FAF9F6" />

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ivory: #faf9f6;
    --stone: #f2f1ed;
    --paper: #ffffff;
    --ink: #222222;
    --ash: #777777;
    --line: #e5e3de;
    --brass: #8c734b;
    --good: #2f5d45;
    --danger: #8f3d3d;
    --sans: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
    --display: "Fraunces", "Iowan Old Style", Palatino, serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--ivory); color: var(--ink); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--sans);
    background: var(--ivory);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, [role="button"], summary, label, a { cursor: pointer; }
  button, input, select { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; letter-spacing: -0.02em; }
  p { text-wrap: pretty; }
  a { color: inherit; text-decoration: none; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; background: var(--stone); }
  ::selection { background: #e4d7c3; }
  .announce {
    background: var(--ink);
    color: var(--ivory);
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 8px 16px;
  }
  header.bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 64px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--ivory) 92%, transparent);
    backdrop-filter: blur(10px);
  }
  .brand { font-family: var(--display); font-size: 24px; letter-spacing: 0.18em; }
  .nav { display: none; gap: 18px; font-size: 14px; }
  .grow { flex: 1; }
  .icon-btn, .btn, .step {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    border: 0;
    background: transparent;
    padding: 0 12px;
  }
  .icon-btn { position: relative; padding: 0 8px; }
  .count {
    position: absolute;
    top: 6px;
    right: 0;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    background: var(--ink);
    color: var(--ivory);
    font-size: 10px;
    line-height: 16px;
    text-align: center;
  }
  .btn {
    background: var(--ink);
    color: var(--ivory);
    padding: 0 20px;
    font-size: 14px;
  }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:hover:not(:disabled) { background: #333; }
  .btn.ghost:hover:not(:disabled) { background: var(--stone); }
  main { min-height: calc(100vh - 220px); }
  .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
  .hero, .split { display: grid; gap: 32px; align-items: center; padding: 48px 0; }
  .eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass); }
  h1 { margin: 16px 0 0; font-size: clamp(40px, 6vw, 64px); line-height: 1.05; max-width: 12ch; }
  .lede { max-width: 38ch; color: var(--ash); line-height: 1.7; margin: 20px 0 0; }
  .frame { background: var(--stone); overflow: hidden; }
  .frame.hero-pic { aspect-ratio: 16/10; }
  .frame.edit { aspect-ratio: 16/11; }
  .frame.card { aspect-ratio: 3/4; }
  .frame.room { aspect-ratio: 4/5; }
  .section-h { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  h2 { margin: 0; font-size: clamp(28px, 4vw, 36px); }
  .rooms, .grid-4, .benefits { display: grid; gap: 16px; }
  .rooms { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .benefits { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 56px 0; }
  .muted { color: var(--ash); }
  .small { font-size: 14px; line-height: 1.6; }
  .tiny { font-size: 12px; letter-spacing: 0.04em; }
  .stone-band { background: color-mix(in srgb, var(--stone) 70%, transparent); padding: 64px 0; }
  .product-name { margin: 12px 0 0; font-size: 14px; }
  .price { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ash); margin: 2px 0 0; }
  .note-box { width: min(560px, 100%); margin: 0 auto; text-align: center; padding: 64px 0; }
  form.row, .filters { display: flex; flex-direction: column; gap: 12px; }
  input, select {
    height: 44px;
    width: 100%;
    border: 1px solid var(--line);
    background: var(--paper);
    padding: 0 12px;
    outline: none;
  }
  input:focus, select:focus, button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 2px;
  }
  label.field { display: block; font-size: 14px; }
  label.field span {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ash);
  }
  footer.site {
    border-top: 1px solid var(--line);
    padding: 40px 0 56px;
  }
  .foot {
    display: grid;
    gap: 18px;
  }
  .foot a { display: inline-block; margin-right: 16px; font-size: 14px; }
  .drawer-back {
    position: fixed;
    inset: 0;
    background: rgba(34, 34, 34, 0.28);
    z-index: 30;
  }
  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 31;
    width: min(420px, 100%);
    height: 100%;
    background: var(--ivory);
    border-left: 1px solid var(--line);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .menu {
    position: fixed;
    inset: 0;
    z-index: 32;
    background: var(--ivory);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .menu a { font-size: 28px; font-family: var(--display); }
  .line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
  }
  .bag-line { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .bag-line .frame { aspect-ratio: 3/4; }
  .steps { display: flex; align-items: center; gap: 8px; }
  .step { width: 44px; padding: 0; border: 1px solid var(--line); background: var(--paper); }
  .pdp { display: grid; gap: 28px; padding: 32px 0 64px; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .choice {
    min-height: 44px;
    padding: 0 16px;
    border: 1px solid var(--line);
    background: transparent;
  }
  .choice.on { border-color: var(--ink); }
  .choice:disabled { opacity: 0.35; }
  details { border-top: 1px solid var(--line); padding: 12px 0; }
  details:last-child { border-bottom: 1px solid var(--line); }
  summary { font-size: 14px; }
  .aside {
    border: 1px solid var(--line);
    background: var(--paper);
    padding: 20px;
    height: fit-content;
  }
  .checkout { display: grid; gap: 28px; padding: 36px 0 72px; }
  .danger { color: var(--danger); font-size: 14px; }
  .good { color: var(--good); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 44px; }
  .check input { width: 16px; height: 16px; }
  .ship {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border: 1px solid var(--line);
    padding: 12px;
    font-size: 14px;
  }
  .empty { padding: 48px 0; color: var(--ash); }
  @media (min-width: 800px) {
    header.bar, .wrap { padding-left: 0; padding-right: 0; }
    header.bar { padding: 0 24px; }
    .nav { display: flex; }
    .menu-btn { display: none; }
    .hero, .split, .pdp, .checkout { grid-template-columns: 1.1fr 0.9fr; }
    .rooms { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .benefits { grid-template-columns: repeat(3, 1fr); gap: 32px; }
    form.row, .filters { flex-direction: row; align-items: center; }
    form.row .btn, .filters .btn { flex: none; }
    .foot { grid-template-columns: 1.4fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>

    '<fieldset style="border:0;padding:0;margin:8px 0"><legend class="tiny muted" style="letter-spacing:.14em;text-transform:uppercase">Shipping</legend>' +
    '<label class="ship"><span><input type="radio" name="ship" value="standard"' + (ui.ship === "standard" ? " checked" : "") + "> Standard</span><span>" + standardText + "</span></label>" +
    '<label class="ship"><span><input type="radio" name="ship" value="express"' + (ui.ship === "express" ? " checked" : "") + "> Express</span><span>" + money(2800) + "</span></label></fieldset>" +
    (ui.error ? '<p class="danger">' + esc(ui.error) + "</p>" : "") +
    '<button class="btn" type="submit"' + (ui.pending || !view.detailed.length ? " disabled" : "") + ">" + (ui.pending ? "Placing order…" : "Place demonstration order") + "</button></div></form>" +
    '<aside class="aside"><h2>Summary</h2>' + (lines || '<p class="small muted">Nothing to total.</p>') +
    '<div class="line" style="margin-top:12px"><span>Subtotal</span><span>' + money(view.subtotal) + "</span></div>" +
    '<div class="line"><span>Shipping</span><span>' + (view.shipping === 0 && view.subtotal ? "Free" : money(view.shipping)) + "</span></div>" +
    '<div class="line"><span>Tax</span><span>' + money(0) + "</span></div>" +
    '<div class="line"><strong>Total</strong><strong>' + money(view.total) + "</strong></div>" +
    '<p class="tiny muted">Tax is recorded as zero. No card is sent to a processor.</p></aside></section>'
  );
}
function orderPage() {
  const number = decodeURIComponent(route().parts[1] || "");
  const order = state().orders.find((item) => item.number === number);
  if (!order) return shell('<section class="wrap" style="padding:36px 0 72px"><h1>Find an order</h1><p class="small muted">Use the order number and the email on the order. This file can only see orders placed in this browser.</p><form id="lookup" class="filters" style="max-width:520px"><input name="number" placeholder="OR-19001" aria-label="Order number" required><input name="email" type="email" placeholder="Email" aria-label="Email" required><button class="btn" type="submit">Look up</button></form>' + (ui.error ? '<p class="danger">' + esc(ui.error) + "</p>" : "") + "</section>");
  const lines = order.lines.map((line) => '<div class="line"><span>' + esc(line.name) + " · " + esc(line.title) + " × " + line.qty + "</span><span>" + money(line.price * line.qty) + "</span></div>").join("");
  return shell('<section class="wrap" style="padding:36px 0 72px;max-width:720px"><p class="tiny muted" style="letter-spacing:.16em">ORDER ' + esc(order.number) + "</p><h1 style=\"max-width:16ch\">Thank you, " + esc(order.name.split(" ")[0]) + '.</h1><p class="small muted">Payment is recorded as a demonstration. No card was charged. Stock in this file has been reduced.</p><div class="line"><span>Payment</span><span class="good">Paid</span></div><div class="line"><span>Shipping</span><span>' + (order.ship === "express" ? "Express" : "Standard") + "</span></div><div class=\"line\"><span>Total</span><strong>" + money(order.total) + "</strong></div>" + lines + "</section>");
}
function aboutPage() {
  return shell('<section class="wrap split"><div><p class="eyebrow">The house</p><h1>A short list, kept honest.</h1><p class="lede">ORRIS sells a few objects meant to be used, mended and counted. Checkout in this file is a demonstration: it checks price and stock, writes an order on this device, and does not charge a card.</p><p class="lede">The merchant desk — cost, profit and the full books — lives in the shop application, not in this portable file.</p></div><div class="frame edit"><img src="' + IMG.editorial + '" alt="Morning still life"></div></section>');
}
function render() {
  const { parts } = route();
  const page = parts[0] || "";
  let html = home();
  if (page === "shop") html = shop();
  else if (page === "product") html = productPage();
  else if (page === "cart") html = cartPage();
  else if (page === "checkout") html = checkoutPage();
  else if (page === "order" || page === "orders") html = orderPage();
  else if (page === "about") html = aboutPage();
  document.getElementById("app").innerHTML = html;
  const title = page === "product" ? (productBySlug(parts[1])?.name || "Piece") + " — ORRIS" : page ? page[0].toUpperCase() + page.slice(1) + " — ORRIS" : "ORRIS — Objects for a considered life";
  document.title = title;
  bind();
}
function bind() {
  const on = (id, event, fn) => { const node = document.getElementById(id); if (node) node.addEventListener(event, fn); };
  on("open-menu", "click", () => { ui.menu = true; render(); });
  on("close-menu", "click", () => { ui.menu = false; render(); });
  on("open-bag", "click", () => { ui.bag = true; render(); });
  on("close-bag", "click", () => { ui.bag = false; render(); });
  on("close-bag-btn", "click", () => { ui.bag = false; render(); });
  document.querySelectorAll("[data-dec]").forEach((node) => node.addEventListener("click", () => {
    const id = node.getAttribute("data-dec");
    const line = state().cart.find((item) => item.variantId === id);
    setQty(id, (line?.qty || 1) - 1);
  }));
  document.querySelectorAll("[data-inc]").forEach((node) => node.addEventListener("click", () => {
    const id = node.getAttribute("data-inc");
    const line = state().cart.find((item) => item.variantId === id);
    setQty(id, (line?.qty || 0) + 1);
  }));
  on("qty-dec", "click", () => { ui.qty = Math.max(1, ui.qty - 1); render(); });
  on("qty-inc", "click", () => { ui.qty = Math.min(10, ui.qty + 1); render(); });
  document.querySelectorAll("[data-variant]").forEach((node) => node.addEventListener("click", () => {
    const id = node.getAttribute("data-variant");
    if (id) { ui.variantId = id; ui.qty = 1; render(); }
  }));
  on("add", "click", () => { addLine(ui.variantId, ui.qty); render(); });
  on("buy", "click", () => { addLine(ui.variantId, ui.qty); ui.bag = false; go("#/checkout"); });
  on("filters", "change", () => {
    const form = new FormData(document.getElementById("filters"));
    const params = new URLSearchParams();
    ["q", "category", "sort"].forEach((key) => { if (form.get(key)) params.set(key, String(form.get(key))); });
    if (form.get("stock")) params.set("stock", "1");
    go("#/shop?" + params.toString());
  });
  on("filters", "submit", (event) => { event.preventDefault(); document.getElementById("filters").dispatchEvent(new Event("change")); });
  on("menu-search", "submit", (event) => {
    event.preventDefault();
    const q = new FormData(event.currentTarget).get("q");
    go("#/shop?q=" + encodeURIComponent(String(q || "")));
  });
  on("list-form", "submit", (event) => {
    event.preventDefault();
    const email = String(new FormData(event.currentTarget).get("email") || "").trim().toLowerCase();
    const data = state();
    ui.note = data.list.includes(email) ? "This address is already on the list." : "Saved in this browser. We'll write when there is something to say.";
    if (!data.list.includes(email)) data.list.push(email);
    persist(data);
    render();
  });
  on("checkout", "submit", (event) => {
    event.preventDefault();
    const form = Object.fromEntries(new FormData(event.currentTarget).entries());
    ui.form = form;
    ui.ship = form.ship || "standard";
    ui.pending = true;
    ui.error = "";
    render();
    try {
      const order = placeOrder(form);
      ui.pending = false;
      ui.form = {};
      ui.bag = false;
      go("#/order/" + order.number);
    } catch (error) {
      ui.pending = false;
      ui.error = error.message || "Checkout failed";
      render();
    }
  });
  document.querySelectorAll('input[name="ship"]').forEach((node) => node.addEventListener("change", () => {
    const form = document.getElementById("checkout");
    if (form) ui.form = Object.fromEntries(new FormData(form).entries());
    ui.ship = node.value;
    render();
  }));
  on("lookup", "submit", (event) => {
    event.preventDefault();
    const form = Object.fromEntries(new FormData(event.currentTarget).entries());
    const order = state().orders.find((item) => item.number.toLowerCase() === String(form.number || "").trim().toLowerCase() && item.email === String(form.email || "").trim().toLowerCase());
    if (!order) { ui.error = "No order in this browser matches that number and email."; render(); return; }
    ui.error = "";
    go("#/order/" + order.number);
  });
  on("reset", "click", () => {
    localStorage.removeItem(KEY);
    ui.note = "";
    ui.error = "";
    ui.bag = false;
    go("#/");
  });
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
